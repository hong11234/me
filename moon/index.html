<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5fb">
<title>小月亮</title>
<style>
:root{--bg:#f7f5fb;--card-rgb:255,255,255;--alpha:.95;--txt:#1e1b2b;--sub:#8d8aa0;--line:#eeecf4;--accent:#7c5cff;--accent2:#b39dff}
html.dark{--card-rgb:38,36,48;--txt:#efedf7;--sub:#9d97b0;--line:#332f42}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background-size:cover;background-position:center;background-attachment:fixed;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
.card{background:rgba(var(--card-rgb),var(--alpha));border-radius:15px;padding:12px;margin-bottom:11px;box-shadow:0 1px 3px rgba(40,30,80,.05)}
.tiny{font-size:11px;color:var(--sub)}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{border:0;border-radius:11px;min-height:36px;padding:2px 12px;background:rgba(124,92,255,.12);color:var(--accent);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.solid{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--sub)}
.btn.danger{background:#fdecec;color:#c0473e}
.btn.block{display:flex;width:100%;min-height:44px;margin-top:8px}
.ib{border:0;background:rgba(var(--card-rgb),.9);border-radius:10px;min-width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:var(--sub)}
#top{position:sticky;top:0;z-index:20;background:rgba(var(--card-rgb),.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:9px 14px}
#top .ti{flex:1;font-size:17px;font-weight:800;letter-spacing:-.3px}
#top .ti em{font-style:normal;font-size:11.5px;color:var(--sub);font-weight:500;margin-left:5px}
main{max-width:640px;margin:0 auto;padding:12px 14px 92px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(var(--card-rgb),.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{max-width:640px;margin:0 auto;display:flex}
.tb{flex:1;border:0;background:transparent;padding:8px 0 9px;font-size:9.5px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.tb .ic{font-size:18px;line-height:1}
.tb.on{color:var(--accent);font-weight:800}

/* OC 卡片 */
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:rgba(var(--card-rgb),.9);border-radius:13px;padding:9px 6px;text-align:center}
.stat b{display:block;font-size:17px;font-weight:800}
.stat span{font-size:10px;color:var(--sub)}
.ocgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.occard{background:rgba(var(--card-rgb),.95);border-radius:15px;overflow:hidden;box-shadow:0 2px 6px rgba(40,30,80,.07);position:relative}
.av{height:104px;position:relative;display:flex;align-items:center;justify-content:center;font-size:34px;background-size:cover;background-position:center}
.ring{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:rgba(255,255,255,.94)}
.ring b{position:relative;z-index:2;font-size:8px;color:#4a3f7a;font-weight:800}
.occard .info{padding:7px 9px 10px}
.occard .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.occard .sub{font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:9px;padding:1px 5px;border-radius:5px;background:rgba(124,92,255,.12);color:#6b53c9}
.tag.warn{background:#fff4e6;color:#b5751c}
.tag.ok{background:#e9f8f2;color:#1f8f6f}
.empty{text-align:center;color:var(--sub);padding:36px 10px;font-size:13px}

/* 详情页 */
#page{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-bottom:40px}
#page .ph{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:9px 14px;background:rgba(var(--card-rgb),.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#page .ph .tt{flex:1;text-align:center;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#page .pb{max-width:640px;margin:0 auto;padding:12px 14px}
.cover{height:120px;position:relative;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:10px;background-color:#d9cff5}
.cover .bigav{width:64px;height:64px;border-radius:50%;background-size:cover;background-position:center;background-color:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 10px rgba(40,30,80,.2)}
.cover .meta{margin-left:9px;padding-bottom:3px}
.cover .meta b{font-size:17px;text-shadow:0 1px 3px rgba(255,255,255,.6)}
.cover .meta div{font-size:11px;color:#4a4560}
.ct{display:flex;gap:4px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.ct::-webkit-scrollbar{display:none}
.ct button{flex:none;border:0;background:rgba(var(--card-rgb),.9);border-radius:9px;padding:6px 11px;font-size:12px;color:var(--sub)}
.ct button.on{background:var(--accent);color:#fff;font-weight:700}
.fbox{background:rgba(var(--card-rgb),.7);border:1px solid var(--line);border-radius:10px;padding:7px 9px;margin-bottom:7px}
.fbox label{display:block;font-size:10px;color:var(--sub)}
.fbox b{font-size:14px;font-weight:600}
.blk{background:rgba(var(--card-rgb),.75);border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin-bottom:8px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.blk .lb{font-size:10px;color:var(--sub);margin-bottom:3px;white-space:normal}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.prow .pn{width:64px;font-size:12px;color:#4a4560}
.pbar{flex:1;height:6px;border-radius:3px;background:rgba(124,92,255,.12);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.prow .pv{font-size:11px;color:var(--sub);width:28px;text-align:right}
.anchors{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.anchor{width:104px;flex:none;background:rgba(var(--card-rgb),.95);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(40,30,80,.07)}
.anchor .im{height:74px;background-size:cover;background-position:center;background-color:#ece8f8;display:flex;align-items:center;justify-content:center;font-size:20px;color:#c3b8e6}
.anchor .tx{padding:5px 6px 7px}
.anchor .tx b{display:block;font-size:11px;line-height:1.35}
.anchor .tx span{font-size:9.5px;color:var(--sub);display:block;margin-top:2px}
.anchor.add{display:flex;align-items:center;justify-content:center;color:#b0a6d4;font-size:20px;border:1px dashed #d9cff5;background:rgba(var(--card-rgb),.6);box-shadow:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph3{position:relative;aspect-ratio:1/1;border-radius:10px;background-size:cover;background-position:center;background-color:#ece8f8}
.ph3 .x{position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border:0;line-height:20px;text-align:center}
.addtile{aspect-ratio:1/1;border-radius:10px;border:1px dashed #d9cff5;display:flex;align-items:center;justify-content:center;font-size:20px;color:#b0a6d4;background:rgba(var(--card-rgb),.6)}
.post{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.post:last-child{border-bottom:0}
.pt{width:40px;height:48px;border-radius:8px;background:linear-gradient(160deg,#efe4ff,#ffd9ec);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.post .pi{flex:1;min-width:0}
.post .pi b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--accent2),#ffd0e6)}
.tli{position:relative;padding:0 0 12px 5px}
.tli::before{content:"";position:absolute;left:-18px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2.5px rgb(var(--card-rgb))}
.tli .e{font-size:10px;color:var(--accent);font-weight:700}
.tli .d{font-size:12.5px;margin-top:1px}
.tli .x{border:0;background:transparent;color:var(--sub);font-size:11px;padding:0 2px}

/* 弹层 */
#mask{position:fixed;inset:0;background:rgba(15,12,25,.42);z-index:80;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:rgb(var(--card-rgb));width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh b{font-size:16px}
.f{margin-bottom:9px}
.f label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:3px}
.inp{width:100%;border:1px solid var(--line);background:rgba(var(--card-rgb),.6);border-radius:11px;padding:9px 11px;outline:none;font-size:14.5px}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:80px;line-height:1.6;resize:vertical}
.sws{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
input[type=color]{width:38px;height:32px;border:1px solid var(--line);border-radius:9px;padding:2px;background:transparent}
#toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,10px);background:rgba(30,27,43,.93);color:#fff;padding:9px 14px;border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 关系网 */
.net{position:relative;height:380px;border-radius:14px;background:radial-gradient(circle at 50% 45%,#fdfcff,#f4f0ff 70%);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;touch-action:none}
.net svg{position:absolute;inset:0;width:100%;height:100%}
.netcv{position:absolute;inset:0;width:100%;height:100%}
.nd{position:absolute;transform:translate(-50%,-50%);text-align:center;width:70px}
.nd .c{width:48px;height:48px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:20px;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(40,30,80,.18);background-size:cover;background-position:center;background-color:#e8e2f8}
.nd .n{font-size:10px;margin-top:2px;font-weight:700;color:#3f3a55}
.nd.sel .c{box-shadow:0 0 0 4px rgba(124,92,255,.28),0 4px 10px rgba(40,30,80,.2)}

/* 换衣间 */
.stagearea{position:relative;border-radius:14px;background:linear-gradient(180deg,#fff,#f6f2ff);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.stagearea .cv{position:relative;width:100%;aspect-ratio:1000/1200;max-height:46vh}
.stagearea .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.guide{position:absolute;inset:6%;border:1px dashed #d9cff5;border-radius:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.chip{flex:none;border:0;background:rgba(var(--card-rgb),.9);border-radius:10px;padding:5px 10px;font-size:12px;color:var(--sub)}
.chip.on{background:var(--accent);color:#fff;font-weight:700}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:4px}
.part{aspect-ratio:1/1;border-radius:11px;border:1px solid var(--line);background:rgba(var(--card-rgb),.90) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:18px;color:#c3b8e6;position:relative}
.part.on{box-shadow:0 0 0 2px var(--accent)}
.part .del{position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:11px;border:0;line-height:18px}
</style>
<link rel="manifest" href="manifest.json">
</head>
<body>

<div id="top"><div class="in">
  <div class="ti" id="topTitle">小月亮<em>我的 OC</em></div>
  <button class="ib" id="btnTools">⚙</button>
  <button class="ib" id="btnAdd" style="background:var(--accent);color:#fff">＋</button>
</div></div>

<main>
  <section id="v-oc">
    <div class="stats" id="ocStats"></div>
    <div class="ocgrid" id="ocGrid"></div>
  </section>

  <section id="v-album" class="hidden">
    <div class="spread" style="margin-bottom:10px"><b>合集</b><button class="btn" id="albumAdd">＋ 新建合集</button></div>
    <div class="tiny" style="margin-bottom:8px">多人图、企划图、场景参考放这里，名字可以改</div>
    <div id="albumList"></div>
  </section>

  <section id="v-dress" class="hidden">
    <div class="spread" style="margin-bottom:8px"><b>换衣间</b><span class="tiny">建议 1000 × 1200 · 透明 PNG</span></div>
    <div class="stagearea"><div class="cv" id="dressCanvas"><div class="guide"></div></div></div>
    <div class="chips" id="dressCats"></div>
    <div class="card">
      <div class="spread"><b style="font-size:14px" id="partTitle">发型</b><button class="btn" id="partAdd">＋ 上传部位图</button></div>
      <div class="parts" id="partGrid"></div>
    </div>
    <div class="row" style="gap:8px">
      <button class="btn block" id="dressReset" style="margin:0">重置</button>
      <button class="btn solid block" id="dressSave" style="margin:0">保存成图</button>
    </div>
  </section>

  <section id="v-world" class="hidden">
    <div class="spread" style="margin-bottom:10px"><b>世界观</b><button class="btn" id="worldAdd">＋ 新建世界</button></div>
    <div id="worldList"></div>
  </section>
</main>

<nav id="tabs"><div class="in">
  <button class="tb on" data-v="oc"><span class="ic">🌙</span>OC</button>
  <button class="tb" data-v="album"><span class="ic">🖼</span>合集</button>
  <button class="tb" data-v="dress"><span class="ic">👗</span>换衣间</button>
  <button class="tb" data-v="world"><span class="ic">🌍</span>世界</button>
</div></nav>

<div id="page" class="hidden"></div>
<div id="mask" class="hidden"><div id="sheet"></div></div>
<div id="toast"></div>

<input type="file" id="fileImg" accept="image/*" multiple class="hidden">
<input type="file" id="fileJson" accept=".json,application/json" class="hidden">

<script>
'use strict';
/* ============ 基础 ============ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const TODAY = () => ymd(new Date());
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtD = ts => { const d = new Date(ts); return (d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const COLORS = ['#7c5cff', '#ff8ab8', '#4fc3a1', '#f6a23c', '#6b9cff', '#8d8aa0'];

let toastT = null;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2000); }

/* ============ 存储 ============ */
let DB = null, MEM = false;
function openDB() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no idb'));
    let r; try { r = indexedDB.open('moon-db', 1); } catch (e) { return rej(e); }
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      if (!db.objectStoreNames.contains('media')) db.createObjectStore('media');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const done = t => new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function kvGet(k) { if (MEM) { const v = localStorage.getItem('M.' + k); return v ? JSON.parse(v) : null; } return rq(DB.transaction('kv', 'readonly').objectStore('kv').get(k)); }
async function kvPut(k, v) { if (MEM) { localStorage.setItem('M.' + k, JSON.stringify(v)); return; } const t = DB.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); await done(t); }
async function mediaPut(id, blob) { if (MEM) throw new Error('浏览器不支持本地存储'); const t = DB.transaction('media', 'readwrite'); t.objectStore('media').put(blob, id); await done(t); }
async function mediaGet(id) { if (MEM) return null; return rq(DB.transaction('media', 'readonly').objectStore('media').get(id)); }
async function mediaDel(id) { if (MEM) return; const t = DB.transaction('media', 'readwrite'); t.objectStore('media').delete(id); await done(t); }
async function mediaKeys() { if (MEM) return []; return rq(DB.transaction('media', 'readonly').objectStore('media').getAllKeys()); }

/* ============ 状态 ============ */
const DEF = () => ({
  v: 1, ocs: [], albums: [], worlds: [], articles: [], relations: [], parts: [], outfit: {},
  history: [], theme: { bg: '#f7f5fb', accent: '#7c5cff', alpha: .95, dark: false, bgImg: null },
  lastSaved: 0
});
let S = DEF();
let saveT = null;
function save() { clearTimeout(saveT); saveT = setTimeout(async () => { S.lastSaved = Date.now(); try { await kvPut('main', S); } catch (e) { toast('保存失败：' + e.message); } }, 150); }
function log(text, ref) { S.history.unshift({ t: Date.now(), text: text, ref: ref || '' }); if (S.history.length > 400) S.history.length = 400; }

const urls = new Map();
async function mediaURL(id) {
  if (!id) return '';
  if (urls.has(id)) return urls.get(id);
  const b = await mediaGet(id); if (!b) return '';
  const u = URL.createObjectURL(b); urls.set(id, u); return u;
}
async function urlOf(id) { return id ? await mediaURL(id) : ''; }

/* ============ 主题 ============ */
function applyTheme() {
  const t = S.theme, r = document.documentElement;
  r.style.setProperty('--bg', t.bg);
  r.style.setProperty('--accent', t.accent);
  r.style.setProperty('--alpha', t.alpha);
  r.classList.toggle('dark', !!t.dark);
  document.body.style.backgroundColor = t.bg;
  if (t.bgImg) mediaURL(t.bgImg).then(u => { if (u) document.body.style.backgroundImage = 'linear-gradient(' + (t.dark ? 'rgba(0,0,0,.5)' : 'rgba(255,255,255,.55)') + ',' + (t.dark ? 'rgba(0,0,0,.5)' : 'rgba(255,255,255,.55)') + '),url("' + u + '")'; });
  else document.body.style.backgroundImage = 'none';
}

/* ============ 图片工具 ============ */
let fileCb = null;
function pickImage(cb, multi) { fileCb = cb; $('#fileImg').multiple = multi ? 'multiple' : ''; $('#fileImg').click(); }
$('#fileImg').onchange = async e => {
  const files = Array.from(e.target.files || []); e.target.value = '';
  if (!files.length || !fileCb) return;
  const out = [];
  for (const f of files) { const b = await compress(f); out.push(b); }
  const cb = fileCb; fileCb = null; cb(out);
};
async function compress(file, max = 1400, q = .84) {
  try {
    let bmp;
    try { bmp = await createImageBitmap(file); } catch (e) {
      bmp = await new Promise((res, rej) => { const im = new Image(); const u = URL.createObjectURL(file); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = rej; im.src = u; });
    }
    const w0 = bmp.width, h0 = bmp.height, s = Math.min(1, max / Math.max(w0, h0));
    const c = document.createElement('canvas'); c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', q)) || file;
  } catch (e) { return file; }
}
async function saveImage(blob) { const id = uid(); await mediaPut(id, blob); return id; }

/* ============ 百分比 ============ */
function progOf(oc) {
  const p = oc.prog || {};
  const v = [p.model || 0, p.art || 0, p.life || 0, p.detail || 0];
  return Math.round(v.reduce((a, b) => a + b, 0) / 4);
}
function ringCss(v) { return 'conic-gradient(#fff 0 ' + v + '%,rgba(255,255,255,.25) ' + v + '% 100%)'; }

/* ============ 关系网 ============ */
let selNode = null;
function openNet(worldId) {
  const w = S.worlds.find(x => x.id === worldId);
  const nodes = S.ocs.filter(o => o.worldId === worldId);
  nodes.forEach((n, i) => {
    if (n.nx == null) {
      const a = -Math.PI / 2 + i * 2 * Math.PI / Math.max(nodes.length, 3);
      n.nx = 0.5 + 0.30 * Math.cos(a);
      n.ny = 0.5 + 0.32 * Math.sin(a);
    }
  });
  let rels = S.relations.filter(r => r.worldId === worldId);
  openPage('<div class="ph"><button class="ib" id="nBack">‹</button><div class="tt">关系网 · ' + esc(w ? w.name : '') + '</div><button class="ib" id="nHelp">?</button></div>' +
    '<div class="pb"><div class="net" id="net"><canvas class="netcv" id="netcv"></canvas></div>' +
    '<p class="tiny" style="margin-top:8px">点一个 OC 再点另一个 → 建立关系；拖动可移动位置。</p>' +
    '<div class="tl" id="relList" style="margin-top:10px"></div></div>');
  $('#nBack').onclick = () => { closePage(); save(); renderOC(); };
  $('#nHelp').onclick = () => toast('点两个头像建立关系；箭头可设单向/双向/决裂');

  const net = $('#net'), cvs = $('#netcv');
  const drawEdges = () => {
    const W = net.clientWidth, H = net.clientHeight;
    if (!W) return;
    cvs.width = W * 2; cvs.height = H * 2;
    const c = cvs.getContext('2d');
    c.setTransform(2, 0, 0, 2, 0, 0); c.clearRect(0, 0, W, H);
    const R = 26;
    const head = (x, y, a, col) => {
      c.fillStyle = col; c.beginPath(); c.moveTo(x, y);
      c.lineTo(x - 9 * Math.cos(a - .36), y - 9 * Math.sin(a - .36));
      c.lineTo(x - 9 * Math.cos(a + .36), y - 9 * Math.sin(a + .36));
      c.closePath(); c.fill();
    };
    rels.forEach(r => {
      const A = S.ocs.find(o => o.id === r.a), B = S.ocs.find(o => o.id === r.b);
      if (!A || !B) return;
      let x1 = A.nx * W, y1 = A.ny * H, x2 = B.nx * W, y2 = B.ny * H;
      const ang = Math.atan2(y2 - y1, x2 - x1);
      x1 += Math.cos(ang) * R; y1 += Math.sin(ang) * R; x2 -= Math.cos(ang) * R; y2 -= Math.sin(ang) * R;
      const col = r.type === 'both' ? '#ff8ab8' : r.type === 'broken' ? '#bdb2de' : '#9d86e8';
      c.strokeStyle = col; c.lineWidth = 1.8;
      c.setLineDash(r.type === 'broken' ? [5, 4] : []);
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.setLineDash([]);
      head(x2, y2, ang, col);
      if (r.type === 'both') head(x1, y1, ang + Math.PI, col);
      if (r.label) {
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        c.font = '11px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        const tw = c.measureText(r.label).width;
        c.fillStyle = 'rgba(255,255,255,.95)';
        const bw = tw + 12, bh = 18, bx = mx - bw / 2, by = my - bh / 2, rr = 8;
        c.beginPath(); c.moveTo(bx + rr, by); c.arcTo(bx + bw, by, bx + bw, by + bh, rr); c.arcTo(bx + bw, by + bh, bx, by + bh, rr); c.arcTo(bx, by + bh, bx, by, rr); c.arcTo(bx, by, bx + bw, by, rr); c.closePath(); c.fill();
        c.fillStyle = '#6b53c9'; c.fillText(r.label, mx, my + .5);
      }
    });
  };
  const renderNodes = () => {
    $$('#net .nd').forEach(e => e.remove());
    nodes.forEach(n => {
      const el = document.createElement('div');
      el.className = 'nd' + (selNode === n.id ? ' sel' : '');
      el.style.left = (n.nx * 100) + '%';
      el.style.top = (n.ny * 100) + '%';
      el.innerHTML = '<div class="c" style="background:linear-gradient(135deg,' + n.color + ',rgba(255,255,255,.4))">' + (n.avatar ? '' : '🌙') + '</div><div class="n">' + esc(n.name) + '</div>';
      const av = el.querySelector('.c');
      if (n.avatar) urlOf(n.avatar).then(u => { if (u) av.style.backgroundImage = 'url("' + u + '")'; });
      enableDrag(el, n);
      net.appendChild(el);
    });
  };
  const drawList = () => {
    $('#relList').innerHTML = rels.length ? rels.map((r, i) => {
      const A = S.ocs.find(o => o.id === r.a), B = S.ocs.find(o => o.id === r.b);
      const sym = r.type === 'both' ? '↔' : r.type === 'broken' ? '┄' : '→';
      return '<div class="tli"><div class="e">' + esc(A ? A.name : '?') + ' ' + sym + ' ' + esc(B ? B.name : '?') + '</div>' +
        '<div class="d">' + esc(r.label || '（没写关系）') + ' <button class="x" data-i="' + i + '">删</button></div></div>';
    }).join('') : '<div class="tiny">还没有关系</div>';
    $$('#relList .x').forEach(b => b.onclick = () => {
      const r = rels.splice(+b.dataset.i, 1)[0];
      if (r) S.relations = S.relations.filter(x => x.id !== r.id);
      save(); drawEdges(); drawList();
    });
  };
  const enableDrag = (el, n) => {
    let startX = 0, startY = 0, ox = 0, oy = 0, moved = false;
    el.onpointerdown = e => {
      e.preventDefault();
      moved = false; startX = e.clientX; startY = e.clientY; ox = n.nx; oy = n.ny;
      el.setPointerCapture(e.pointerId);
      el.onpointermove = ev => {
        const dx = (ev.clientX - startX) / net.clientWidth, dy = (ev.clientY - startY) / net.clientHeight;
        if (Math.abs(dx) + Math.abs(dy) > 0.012) moved = true;
        n.nx = Math.max(.08, Math.min(.92, ox + dx)); n.ny = Math.max(.1, Math.min(.9, oy + dy));
        el.style.left = (n.nx * 100) + '%'; el.style.top = (n.ny * 100) + '%';
        drawEdges();
      };
      el.onpointerup = () => {
        el.onpointermove = null; el.onpointerup = null;
        if (moved) { save(); }
        else tapNode(n);
      };
    };
  };
  const tapNode = n => {
    if (!selNode) { selNode = n.id; renderNodes(); drawEdges(); toast('已选 ' + n.name + '，再点一个建立关系'); return; }
    if (selNode === n.id) { selNode = null; renderNodes(); return; }
    const a = selNode, b = n.id; selNode = null;
    openSheet('<div class="sh"><b>建立关系</b><button class="ib" data-x="1">✕</button></div>' +
      '<div class="f"><label>关系文字（显示在箭头上）</label><input class="inp" id="rLabel" placeholder="师徒 / 同伴 / 单恋"></div>' +
      '<div class="f"><label>方向</label><select class="inp" id="rType"><option value="one">单向 →（A 对 B）</option><option value="both">互相 ↔</option><option value="broken">已决裂 ┄</option></select></div>' +
      '<button class="btn solid block" id="rSave">保存</button>');
    $('#rSave').onclick = () => {
      const rel = { id: uid(), a: a, b: b, type: $('#rType').value, label: $('#rLabel').value.trim(), worldId: worldId };
      S.relations.push(rel); rels.push(rel);
      log('建立关系：' + (rel.label || ''), a);
      save(); closeSheet(); renderNodes(); drawEdges(); drawList();
    };
  };
  renderNodes(); drawEdges(); drawList();
  window.addEventListener('resize', drawEdges, { once: true });
}

const CATS = ['背景', '身体', '发型', '眼睛', '嘴巴', '服装', '配饰'];
let curCat = '发型';
function renderDress() {
  $('#dressCats').innerHTML = CATS.map(c => '<button class="chip' + (c === curCat ? ' on' : '') + '" data-c="' + c + '">' + c + '</button>').join('');
  $$('#dressCats .chip').forEach(b => b.onclick = () => { curCat = b.dataset.c; renderDress(); });
  $('#partTitle').textContent = curCat;
  const parts = S.parts.filter(p => p.cat === curCat);
  $('#partGrid').innerHTML = (parts.length ? parts.map(p => '<div class="part' + (S.outfit[curCat] === p.id ? ' on' : '') + '" data-id="' + p.id + '" data-img="' + p.img + '"><button class="del" data-del="' + p.id + '">✕</button></div>').join('') : '') +
    '<div class="part" id="partAddTile">＋</div>';
  $$('#partGrid .part[data-img]').forEach(el => { urlOf(el.dataset.img).then(u => { if (u) el.style.backgroundImage = 'url("' + u + '")'; }); el.onclick = e => { if (e.target.classList.contains('del')) return; S.outfit[curCat] = el.dataset.id; save(); renderDress(); }; });
  $$('#partGrid [data-del]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const id = b.dataset.del;
    S.parts = S.parts.filter(x => x.id !== id);
    if (S.outfit[curCat] === id) delete S.outfit[curCat];
    mediaDel(id).catch(() => {});
    save(); renderDress();
  });
  $('#partAddTile').onclick = () => pickImage(async bs => { for (const x of bs) { S.parts.push({ id: uid(), cat: curCat, img: await saveImage(x) }); } save(); renderDress(); }, true);

  const cv = $('#dressCanvas');
  cv.querySelectorAll('img').forEach(i => i.remove());
  CATS.forEach(c => {
    const pid = S.outfit[c]; if (!pid) return;
    const p = S.parts.find(x => x.id === pid); if (!p) return;
    const im = document.createElement('img');
    urlOf(p.img).then(u => { if (u) im.src = u; });
    cv.appendChild(im);
  });
}
async function exportDress() {
  const c = document.createElement('canvas'); c.width = 1000; c.height = 1200;
  const ctx = c.getContext('2d'); ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.clearRect(0, 0, 1000, 1200);
  for (const cat of CATS) {
    const pid = S.outfit[cat]; if (!pid) continue;
    const p = S.parts.find(x => x.id === pid); if (!p) continue;
    const b = await mediaGet(p.img); if (!b) continue;
    const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(b); });
    ctx.drawImage(im, 0, 0, 1000, 1200);
  }
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const id = await saveImage(blob);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '换衣间-' + TODAY() + '.png'; a.click();
  toast('已保存并下载');
  return id;
}

async function doExport() {
  toast('正在打包…');
  const keys = await mediaKeys();
  const media = [];
  for (const k of keys) { const b = await mediaGet(k); if (b) media.push({ id: k, type: b.type, data: await b64(b) }); }
  const blob = new Blob([JSON.stringify({ app: '小月亮', v: 1, state: S, media: media })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '小月亮备份-' + TODAY() + '.json'; a.click();
  toast('已导出 ' + (blob.size / 1048576).toFixed(1) + 'MB');
}
const b64 = blob => new Promise(res => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.readAsDataURL(blob); });
const unb64 = (s, m) => { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: m || 'application/octet-stream' }); };
$('#fileJson').onchange = async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const pack = JSON.parse(await f.text());
    if (!pack.state) throw new Error('格式不对');
    if (!confirm('恢复备份会覆盖当前数据，确定？')) return;
    S = Object.assign(DEF(), pack.state);
    for (const m of (pack.media || [])) { try { await mediaPut(m.id, unb64(m.data, m.type)); } catch (err) {} }
    await kvPut('main', S); applyTheme(); renderAll(); toast('恢复完成');
  } catch (err) { toast('恢复失败：' + err.message); }
};

/* ============ 资料卡导出 ============ */
async function exportCard(o) {
  const W = 720, H = 1000;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#f7f5fb'; x.fillRect(0, 0, W, H);
  x.fillStyle = o.color || '#7c5cff'; x.fillRect(0, 0, W, 190);
  if (o.cover) { try { const b = await mediaGet(o.cover); if (b) { const im = await imgOf(b); x.drawImage(im, 0, 0, W, 190); } } catch (e) {} }
  x.fillStyle = 'rgba(0,0,0,.18)'; x.fillRect(0, 0, W, 190);
  x.fillStyle = '#fff'; x.font = 'bold 40px sans-serif'; x.fillText(o.name || '', 40, 300);
  x.font = '20px sans-serif'; x.fillStyle = '#6b6480';
  x.fillText([o.alias, o.age ? o.age + ' 岁' : '', o.birth].filter(Boolean).join(' · '), 40, 336);
  let y = 380;
  x.fillStyle = '#3f3a55'; x.font = '18px sans-serif';
  (o.keywords || []).slice(0, 6).forEach((k, i) => { x.fillText('#' + k, 40 + i * 100, y); });
  y += 46;
  const lines = wrapText(x, o.bio || '（还没有简介）', 640, 18);
  x.font = '18px sans-serif'; x.fillStyle = '#3f3a55';
  lines.slice(0, 8).forEach(l => { x.fillText(l, 40, y); y += 30; });
  y += 16;
  x.fillStyle = '#8d8aa0'; x.font = '15px sans-serif';
  ['三视图', '立绘', '人生经历', '详细设定'].forEach((n, i) => {
    const v = [o.prog.model, o.prog.art, o.prog.life, o.prog.detail][i] || 0;
    x.fillText(n + ' ' + v + '%', 40 + (i % 2) * 320, y + Math.floor(i / 2) * 34);
  });
  x.fillStyle = '#b0a6d4'; x.font = '14px sans-serif'; x.fillText('小月亮 · ' + TODAY(), 40, H - 36);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (o.name || 'OC') + '-资料卡.png'; a.click();
  toast('资料卡已导出');
}
function imgOf(blob) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(blob); }); }
function wrapText(ctx, text, maxW, size) {
  ctx.font = size + 'px sans-serif';
  const out = []; let line = '';
  for (const ch of text.replace(/\n/g, ' ')) { if (ctx.measureText(line + ch).width > maxW) { out.push(line); line = ch; } else line += ch; }
  if (line) out.push(line); return out;
}

    '<div class="f"><label>卡片不透明度</label><input type="range" id="thAlpha" min="50" max="100" value="' + Math.round(S.theme.alpha * 100) + '" style="width:100%"></div>' +

  $$('#thBg .sw').forEach(b => b.onclick = () => { S.theme.bg = b.dataset.c; S.theme.dark = b.dataset.c === '#1e2026'; S.theme.bgImg = null; applyTheme(); save(); closeSheet(); openTheme(); });
  $$('#thAc .sw').forEach(b => b.onclick = () => { S.theme.accent = b.dataset.c; applyTheme(); save(); closeSheet(); openTheme(); });

  $('#thDark').onclick = () => { S.theme.dark = !S.theme.dark; applyTheme(); save(); closeSheet(); openTheme(); };

}

/* ============ 初始化 ============ */
function renderAll() { renderOC(); renderAlbums(); renderWorlds(); renderDress(); }
(async function boot() {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  for (let attempt = 1; attempt <= 3 && !DB; attempt++) {
    try { DB = await withTimeout(openDB(), 8000); }
    catch (e) {
      console.warn('数据库打开失败（第 ' + attempt + ' 次）', e);
      if (attempt === 3) MEM = true; else await wait(600);
    }
  }
  let raw = null;
  try { raw = DB ? await withTimeout(kvGet('main'), 3000) : null; } catch (e) {}
  if (raw) S = Object.assign(DEF(), raw);
  applyTheme(); renderAll();
  if (MEM) setTimeout(() => toast('本地数据库被限制，已切兼容模式：文字能存，图片可能存不住'), 1200);
})();
window.addEventListener('pagehide', () => save());
